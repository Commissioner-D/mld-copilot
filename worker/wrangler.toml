name = "mld-copilot"
main = "src/index.js"
compatibility_date = "2025-06-01"
workers_dev = true
preview_urls = false

[vars]
LEAGUE_ID = "294292"            # MLD; Sandkiste waere 305982
TRADE_HOURS = "72"
TEST_MODE = "0"                 # "1" = Beteiligte duerfen mitstimmen (nur zum Testen)
ALLOWED_ORIGINS = "https://commissioner-d.github.io"

[[d1_databases]]
binding = "DB"
database_name = "mld-copilot"
database_id = "__D1_ID__"       # wird beim Deploy eingesetzt
migrations_dir = "migrations"

[triggers]
crons = ["7 * * * *"]           # stuendlicher Trade-Check

[observability]
enabled = true
